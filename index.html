
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101827;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    h1 {
      color: #4ade80;
      margin-bottom: 20px;
      font-size: 2.3rem;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      gap: 12px;
    }

    .score-box {
      background: #1e293b;
      padding: 12px;
      border-radius: 10px;
      flex: 1;
      font-size: 15px;
    }

    .score-box span {
      color: #4ade80;
      font-weight: bold;
      font-size: 20px;
    }

    .board {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: #0b1220;
      border: 3px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 18, 32, 0.86);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 20px;
    }

    .overlay h2 {
      font-size: 2rem;
      color: #4ade80;
    }

    .overlay p {
      color: #cbd5e1;
      line-height: 1.5;
    }

    button {
      background: #4ade80;
      color: #052e16;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #22c55e;
      transform: scale(1.03);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .controls button {
      min-width: 105px;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(2, 48px);
      justify-content: center;
      gap: 5px;
      margin: 20px auto 0;
    }

    .dpad button {
      padding: 8px;
      font-size: 21px;
      background: #1e293b;
      color: #4ade80;
      border: 1px solid #475569;
      touch-action: manipulation;
    }

    .dpad button:active {
      background: #334155;
    }

    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }

    .help {
      margin-top: 15px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      h1 { font-size: 1.8rem; }
      .score-box { padding: 9px 5px; }
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>🐍 Snake Game</h1>

    <div class="scoreboard">
      <div class="score-box">
        Score<br><span id="score">0</span>
      </div>
      <div class="score-box">
        Best<br><span id="best">0</span>
      </div>
    </div>

    <div class="board">
      <canvas id="canvas" width="400" height="400"></canvas>

      <div class="overlay" id="overlay">
        <h2 id="message">Snake Game</h2>
        <p id="description">Eat the food and avoid hitting yourself!</p>
        <button id="startBtn">Start Game</button>
      </div>
    </div>

    <div class="controls">
      <button id="pauseBtn">⏸ Pause</button>
      <button id="restartBtn">↻ Restart</button>
    </div>

    <div class="dpad">
      <button class="up" data-dir="up" aria-label="Up">▲</button>
      <button class="left" data-dir="left" aria-label="Left">◀</button>
      <button class="down" data-dir="down" aria-label="Down">▼</button>
      <button class="right" data-dir="right" aria-label="Right">▶</button>
    </div>

    <p class="help">
      Keyboard: Arrow keys or WASD<br>
      Space: Pause / Resume
    </p>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const message = document.getElementById("message");
    const description = document.getElementById("description");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");

    const GRID = 20;
    const CELL = canvas.width / GRID;

    let snake, food, direction, nextDirection;
    let score = 0;
    let best = 0;
    let running = false;
    let gameOver = false;
    let paused = false;
    let lastTime = 0;
    let accumulator = 0;

    try {
      best = Number(localStorage.getItem("snakeBest")) || 0;
    } catch (_) {}

    bestEl.textContent = best;

    function reset() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      accumulator = 0;
      lastTime = 0;
      gameOver = false;
      paused = false;
      running = true;

      scoreEl.textContent = score;
      pauseBtn.textContent = "⏸ Pause";
      overlay.style.display = "none";

      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (
        snake.some(part => part.x === food.x && part.y === food.y)
      );
    }

    function setDirection(x, y) {
      if (!running || paused) return;

      // Prevent reversing into the snake's own body.
      if (x === -direction.x && y === -direction.y) return;

      nextDirection = { x, y };
    }

    function update() {
      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const eating = head.x === food.x && head.y === food.y;

      // Wall collision.
      if (
        head.x < 0 || head.x >= GRID ||
        head.y < 0 || head.y >= GRID
      ) {
        endGame();
        return;
      }

      // Allow moving into the tail's old position when not eating.
      const body = eating ? snake : snake.slice(0, -1);

      if (body.some(part => part.x === head.x && part.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (eating) {
        score += 10;
        scoreEl.textContent = score;

        if (score > best) {
          best = score;
          bestEl.textContent = best;

          try {
            localStorage.setItem("snakeBest", best);
          } catch (_) {}
        }

        if (snake.length === GRID * GRID) {
          running = false;
          gameOver = true;
          showOverlay("You Win! 🎉", "You filled the entire board!");
          return;
        }

        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid.
      ctx.strokeStyle = "#172337";
      ctx.lineWidth = 1;

      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // Food.
      ctx.fillStyle = "#fb7185";
      ctx.beginPath();
      ctx.arc(
        food.x * CELL + CELL / 2,
        food.y * CELL + CELL / 2,
        CELL * 0.38,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Snake.
      snake.forEach((part, index) => {
        const padding = 1.5;
        ctx.fillStyle = index === 0 ? "#86efac" : "#22c55e";

        ctx.beginPath();
        ctx.roundRect(
          part.x * CELL + padding,
          part.y * CELL + padding,
          CELL - padding * 2,
          CELL - padding * 2,
          4
        );
        ctx.fill();
      });

      // Eyes on the head.
      const head = snake[0];
      const cx = head.x * CELL + CELL / 2;
      const cy = head.y * CELL + CELL / 2;

      const eyeOffset = 4;
      const eyeSide = 4;

      ctx.fillStyle = "#052e16";

      if (direction.x !== 0) {
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(
            cx + direction.x * eyeOffset,
            cy + sign * eyeSide,
            1.6,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      } else {
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(
            cx + sign * eyeSide,
            cy + direction.y * eyeOffset,
            1.6,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }
    }

    function endGame() {
      running = false;
      gameOver = true;
      showOverlay("Game Over!", `Your score: ${score}`);
    }

    function showOverlay(title, text) {
      message.textContent = title;
      description.textContent = text;
      startBtn.textContent = gameOver ? "Play Again" : "Start Game";
      overlay.style.display = "flex";
    }

    function togglePause() {
      if (!running && !paused) return;

      paused = !paused;
      pauseBtn.textContent = paused ? "▶ Resume" : "⏸ Pause";

      if (paused) {
        message.textContent = "Paused";
        description.textContent = "Take a break!";
        startBtn.textContent = "Resume Game";
        overlay.style.display = "flex";
      } else {
        overlay.style.display = "none";
        lastTime = 0;
        accumulator = 0;
      }
    }

    function loop(timestamp) {
      if (running && !paused) {
        if (!lastTime) lastTime = timestamp;

        const delta = Math.min(timestamp - lastTime, 100);
        lastTime = timestamp;
        accumulator += delta;

        // Snake gets faster as the score increases.
        const speed = Math.max(65, 140 - score * 0.5);

        while (accumulator >= speed && running && !paused) {
          update();
          accumulator -= speed;
        }

        draw();
      }

      requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", () => {
      if (paused && running) {
        togglePause();
      } else {
        reset();
      }
    });

    pauseBtn.addEventListener("click", togglePause);

    document.getElementById("restartBtn").addEventListener("click", reset);

    const directions = {
      ArrowUp: [0, -1],
      w: [0, -1],
      W: [0, -1],
      ArrowDown: [0, 1],
      s: [0, 1],
      S: [0, 1],
      ArrowLeft: [-1, 0],
      a: [-1, 0],
      A: [-1, 0],
      ArrowRight: [1, 0],
      d: [1, 0],
      D: [1, 0]
    };

    document.addEventListener("keydown", event => {
      if (directions[event.key]) {
        event.preventDefault();
        const [x, y] = directions[event.key];
        setDirection(x, y);
      } else if (event.code === "Space") {
        event.preventDefault();

        if (running || paused) {
          togglePause();
        } else if (gameOver) {
          reset();
        }
      }
    });

    document.querySelectorAll("[data-dir]").forEach(button => {
      button.addEventListener("click", () => {
        const dirs = {
          up: [0, -1],
          down: [0, 1],
          left: [-1, 0],
          right: [1, 0]
        };

        const [x, y] = dirs[button.dataset.dir];
        setDirection(x, y);
      });
    });

    // Initial screen.
    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    food = { x: 15, y: 10 };

    draw();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
